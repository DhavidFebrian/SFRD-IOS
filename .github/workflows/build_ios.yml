name: Build iOS IPA & Multiplatform

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍏 Build iOS Application (IPA)
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Locate Flutter Project Directory
        id: locate-project
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "project_dir=." >> $GITHUB_OUTPUT
          elif [ -f "SFRD_IOS/pubspec.yaml" ]; then
            echo "project_dir=SFRD_IOS" >> $GITHUB_OUTPUT
          else
            echo "project_dir=." >> $GITHUB_OUTPUT
          fi

      - name: 📱 Generate Native iOS Xcode Project Structure
        run: |
          cd ${{ steps.locate-project.outputs.project_dir }}
          flutter create --project-name sfrd_ios --platforms=ios --org com.aistudio.jadwalfoto.qywrkx .

      - name: ⚙️ Configure iOS 15.5+ Deployment Target & Bypass Signing
        run: |
          cd ${{ steps.locate-project.outputs.project_dir }}
          # Set minimum iOS deployment target in Podfile & Xcode project to 15.5
          if [ -f "ios/Podfile" ]; then
            sed -i '' "s/# platform :ios.*/platform :ios, '15.5'/g" ios/Podfile || true
            sed -i '' "s/platform :ios.*/platform :ios, '15.5'/g" ios/Podfile || true
          fi
          if [ -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9\.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" ios/Runner.xcodeproj/project.pbxproj || true
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = /DEVELOPMENT_TEAM = 5A12345678;\
				CODE_SIGNING_REQUIRED = NO;\
				CODE_SIGNING_ALLOWED = NO;\
				PRODUCT_BUNDLE_IDENTIFIER = /g" ios/Runner.xcodeproj/project.pbxproj || true
          fi
          if [ -f "ios/Flutter/Release.xcconfig" ]; then
            echo "DEVELOPMENT_TEAM=5A12345678" >> ios/Flutter/Release.xcconfig
            echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
            echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
            echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          fi
          if [ -f "ios/Runner/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'RWC - Media Production'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'RWC - Media Production'" ios/Runner/Info.plist || true
          fi

      - name: 📦 Install Flutter Dependencies
        run: |
          cd ${{ steps.locate-project.outputs.project_dir }}
          flutter pub get

      - name: 🍎 Set up CocoaPods & Build Settings
        run: |
          cd ${{ steps.locate-project.outputs.project_dir }}/ios
          pod repo update || true
          pod install || true

      - name: 🚀 Build iOS IPA (No-CodeSign for Sideloading/AltStore/TrollStore)
        run: |
          cd ${{ steps.locate-project.outputs.project_dir }}
          # Build with Flutter no-codesign, or fallback to direct xcodebuild
          flutter build ios --no-codesign --release || {
            echo "Direct xcodebuild fallback..."
            cd ios
            xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
            cd ..
          }
          
          # Find Runner.app and package Payload into installable .ipa
          mkdir -p build/ios/iphoneos/Payload
          RUNNER_DIR=$(find . -name "Runner.app" -type d | head -n 1)
          if [ -n "$RUNNER_DIR" ]; then
            cp -r "$RUNNER_DIR" build/ios/iphoneos/Payload/
            cd build/ios/iphoneos
            zip -r SFRD-Release.ipa Payload
            cp SFRD-Release.ipa RWC-Media-Production.ipa
            echo "IPA Created successfully at build/ios/iphoneos/SFRD-Release.ipa & RWC-Media-Production.ipa"
          else
            echo "Error: Runner.app not found!"
            exit 1
          fi

      - name: 📤 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RWC-Media-Production-iOS-IPA
          path: ${{ steps.locate-project.outputs.project_dir }}/build/ios/iphoneos/*.ipa
          if-no-files-found: warn

      - name: 📤 Upload Runner.app Archive
        uses: actions/upload-artifact@v4
        with:
          name: SFRD-iOS-App-Archive
          path: ${{ steps.locate-project.outputs.project_dir }}/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
